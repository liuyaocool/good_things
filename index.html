<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="initial-scale=0.8">
    <title>GoodSearch</title>
<style>
    body, body * {box-sizing: border-box;}
    html, body { height: 100%; }
    body {
        background-color: #181a1b;
        margin: 0;
    }
    #jsonContainer, #imgContainer {
        padding-bottom: 30px;
    }
    #jsonContainer {
        color: white;
    }
    #jsonContainer > div {
        margin: 5px;
        position: relative;
        background-color: #80808030;
        padding: 0 10px 10px 10px;
    }
    .fn {
        position: sticky;
        top: 0;
        color: #97ff00;
        font-size: 12px;
        text-align: right;
        height: 0px;
    }
    #jsonContainer h3 {
        color: #808080a3;
        font-size: 12px;
        margin: 10px 0 0 0;
    }
    #jsonContainer ul {
        padding-left: 15px;
        margin-top: 0px;
    }

    #imgContainer {
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        height: 100%;
        gap: 5px;
        align-content: flex-start;
        overflow: auto;
    }
    #imgContainer img {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
    }
    #filterText {
        width: 230px;
        margin-bottom: 6px;
        color: white;
        outline: none;
        border: 1px solid #be9805;
        background-color: #0000;
        backdrop-filter: blur(3px);
    }
    #filterText:focus {
        border-color: #ffcb00;
    }
    hl {color: greenyellow;}
    sp {padding: 5px;}
    wh {color: white;}
    .item {
        width: 200px;
        display: inline-block;
        border-radius: 8px;
        overflow: hidden;
        background-color: #2a2c2e;
        border: 1px solid #727272;
    }
    .item img {
        width: 100%;
    }
    .item p {
        font-size: 14px;
        line-height: 1.4;
        margin: 0;
        padding: 2px 6px;
        color: gray;
    }
    .item > p::first-line {
        color: white;
    }
    .input {
        position: fixed;
        bottom: 3px;
        /* left: 200px; */
        /* left: 50%; */
        /* transform: translateX(-50%); */
    }
    #msg {
        color: goldenrod;
    }
    .btn {
        cursor: pointer;
    }
    .choose-btn {
        background-color: #ffcc03;
    }
    li {
        position: relative;
    }
    li:hover .line-btn {
        display: inline;
    }
    .line-btn {
        display: none;
        padding: 0 2px;
        line-height: 12px;
    }
</style>
</head>
<body>
<div id="jsonContainer"></div>
<div id="imgContainer"></div>
<div class="input">
    <input id="filterText" type="text">
    <input type="button" class="btn choose-btn" onclick="search_pic()" value="pic">
    <input type="button" class="btn" onclick="search_text()" value="text">
    <span id="msg"></span>
</div>
</body>
<script>

    window.onbeforeunload = ev => {sessionStorage.filterText = filterText.value;}
    if (sessionStorage.filterText && sessionStorage.filterText != 'undefined') filterText.value = sessionStorage.filterText;

    let files = [], files_json = {},
        need_file_name_idx = 3,
        files_json_name = ['00_plot', '02_japan_infantry', '01_japan', '03_fc2ppv',
            '300MIUM',
            'AARM', 'ATOM', 'CLUB', 'DANDY', 'DOCP', 'FAA', 'FSET', 'FTKD', 'GBAN', 'GDHH', 'GETS',
            'HEZ', 'HGOT', 'HHF', 'HQIS', 'HTMS', 'HUNBL', 'HUNTA', 'HUNTB', 'HUNTC', 'HUNT',
            'IENE', 'IENF', 'JNC', 'KIL', 'LHBY', 'MFO', 'MIMU', 'NASH', 'NHDTA', 'NHDTB', 'NHDT', 'NXG',
            'OVG', 'RCT', 'RDD', 'RDT', 'RTP', 'SCOP', 'SCPX', 'SIM', 'SUJI', 'SW', 'VRTM', 'VSPDS', 'WA', 'ZMEN',
        ];
    fetch_file("piclist").then(text => {
        let lines = text.split('\n');
        for (let i = 4; i < lines.length; i++) {
            if (!lines[i]
                || lines[i].endsWith('.DS_Store')
                || lines[i].startsWith('pic/no/')
            ) continue;
            files.push(lines[i]);
        }
    });

    for (const fn of files_json_name) {
        fetch_file(`video/japan/${fn}.json`)
            .then(text => files_json[fn] = JSON.parse(text))
            .catch(e => console.error(`---${fn}---`, e));
    }

    function search_text() {
        let s = filterText.value.trim();
        if (!s) {
            msg.innerHTML = '输入关键词再搜索.';
            return;
        }
        switch_container(jsonContainer);

        let fn_html, k_html, k_fn, exclude_k, is_full_fn = false,
            html_full = '', html_fn, html_block, html_line;
        while ((html_fn = s.indexOf(':')) >= 0) {
            // 空格在:前边的 不是文件名匹配逻辑
            if ((html_block = s.indexOf(' ')) >= 0 && html_block < html_fn) break;
            // 分割文件名的 搜索key
            k_fn = [s.slice(0, html_fn)];
            // 分割出行的 搜索key
            s = s.slice(html_fn + 1);
            // 判断是否显示全文
            is_full_fn = s ? false : true;
            break;
        }
        hl_keys(s);
        console.log(123)

        for(const [i,fn] of files_json_name.entries()) {
            html_fn = '';
            console.log(fn)
            // 匹配文件名 文件名的逻辑都在这个字段，有key则匹配名称，无则为true
            if (k_fn && !(fn_html = hl_replace(fn, k_fn))) continue;
            // 遍历文件
            for(const k in files_json[fn]) {
                html_block = '';
                // json的key 后缀为xx的不显示
                exclude_k = k.length < 5 && k.endsWith('xx');
                // json的key 的html文本
                k_html = exclude_k ? '' : hl_replace(k);
                // 遍历文件key
                for (const line of files_json[fn][k]) {
                    html_line = hl_replace(line);
                    // 文件名匹配 或 json的key匹配 或 行匹配
                    if (is_full_fn || k_html || html_line) {
                        html_block += `<li>
                            <input class="line-btn" type="button" onclick="li_click(this)" value="mav">
                            <input class="line-btn" type="button" onclick="li_click(this)" value="goi">
                            <input class="line-btn" type="button" onclick="li_click(this)" value="bt">
                            ${i > need_file_name_idx ? (fn + '-') : ''}${html_line ? html_line.join('') : line}
                        </li>`;                        
                    }
                }
                if (html_block) {
                    html_fn += (exclude_k ? '' : `<h3>${(k_html ? k_html.join('') : k)}</h3>`) + `<ul>${html_block}</ul>`;
                }
            }
            if (html_fn) html_full += `<div><div class="fn">${fn}</div>${html_fn}</div>`;
        }
        jsonContainer.innerHTML = html_full;
    }

    function li_click(dom) {
        let line = dom.parentElement.innerText.trim();
        let line_sp = line.split(' ');
        let url;
        switch(dom.value) {
            case 'mav': url = `https://missav.ws/en/search/${line_sp[0]}`; break;
            case 'goi': url = `https://www.google.com/search?q=${line_sp[0]}&tbm=isch`; break;
            case 'bt':
                url = `https://skrbtso.top/search?keyword=${line_sp[0]}-C`; 
                copyToClipboard(`${line_sp[0]}-C`);
                break;
            default: return;
        }
        window.open(url, "_blank", "noopener,noreferrer");
    }

    function search_pic() {
        let s = filterText.value.trim();
        if (!s) {
            msg.innerHTML = '输入关键词再搜索.';
            return;
        }
        switch_container(imgContainer);
        hl_keys(s);
        let imgHtml = '', lineHtml;
        for (const line of files) {
            if (!(lineHtml = hl_replace(line.slice(4, line.lastIndexOf('.'))))) continue;
            lineHtml[lineHtml.lastIndexOf('/')] += '<br>';
            imgHtml += `<div class="item">
                <img draggable="false" src="${line}">
                <p>${lineHtml.join('')}</p>
                </div>`;
        }
        imgContainer.innerHTML = imgHtml;
    }
    function switch_container(container_dom) {
        jsonContainer.style.display = 'none';
        imgContainer.style.display = 'none';
        container_dom.style.display = '';
    }

    function hl_keys(keys) {
        keys = keys.toLowerCase().split(' ');
        let k1, k2, tmp;
        for (let i = 0; i < keys.length; i++) {
            if (!keys[i]) continue;
            for (let j = i + 1; j < keys.length; j++) {
                if (!keys[j]) continue;
                [k1, k2] = [keys[i], keys[j]];
                if (k1[0] == '-' && k2[0] == '-') {
                    tmp = k1;
                    k1 = k2.slice(1);
                    k2 = tmp.slice(1);
                } else if (k1[0] == '-' || k2[0] == '-') {
                    continue;
                }
                if (k2.indexOf(k1) >= 0) {
                    keys[i] = '';
                    break;
                }
                if (k1.indexOf(k2) >= 0) {
                    keys[j] = '';
                }
            }
        }
        window.hl_key_arr = keys;
        return keys;
    }

    // return array, 如果需要字符串, 调用 .join('');
    function hl_replace(line_origin, hl_key_arr = window.hl_key_arr, hl_start = '<hl>', hl_end = '</hl>') {
        let line = line_origin.toLowerCase();
        let key_bit = new Array(line.length).fill(0), key_idx;
        for (let k of hl_key_arr) {
            if (!k) continue;
            k = k.toLowerCase();
            if(k[0] == '-') {
                if (line.indexOf(k.slice(1)) >= 0) return null;
                continue;
            }
            if ((key_idx = line.indexOf(k)) < 0) return null;
            do {
                for (let i = 0; i < k.length; i++) {
                    key_bit[key_idx + i] = 1;
                }
            } while ((key_idx = line.indexOf(k, key_idx + 1)) >= 0)
        }
        let res = [], prev_bit = 0;
        // 合并 且 加上高亮字符串
        for (let i = 0; i < line.length; i++) {
            res[i] = line_origin[i];
            if (key_bit[i] == prev_bit) continue;
            res[i] = (key_bit[i] == 0 ? hl_end : hl_start ) + line_origin[i];
            prev_bit = key_bit[i];
        }
        if (key_bit[key_bit.length-1] == 1) {
            res[res.length-1] += hl_end; 
        }
        return res;
    }

    function is_num(c) {
        return 47 < c.charCodeAt(0) && c.charCodeAt(0) < 58;
    }

    function copyToClipboard(text) {
        if (navigator.clipboard) { // 需https
            navigator.clipboard.writeText(text).catch(() => {
                copyToClipboardOld(text);
            });        
        } else {
            copyToClipboardOld(text);
        }
        // navigator.clipboard.write([new ClipboardItem({ "text/plain": new Blob(["mingzi哈哈哈哈"], { type: "text/plain" }) })]);
    }

    function copyToClipboardOld(str) {
        let dom = document.getElementById("lyCopyContainer");
        if (!dom) {
            let textDom = document.createElement('textarea');
            textDom.id = "lyCopyContainer";
            textDom.style.position = 'absolute';
            textDom.style.top = '-100%';
            document.body.append(textDom);
            dom = document.getElementById("lyCopyContainer");
        }
        dom.value = str;
        dom.setSelectionRange(0, str.length);
        dom.select();
        document.execCommand('copy');
    }

    async function fetch_file(file_path) {
        return (await (await fetch(file_path)).text());
    }

    document.onkeydown = function (ev) {
        console.log(`${ev.code}`);
        switch(ev.code) {
            case 'Slash': 
                // 排除浏览器默认搜索按键
                if ('INPUT' == ev.target.tagName && ev.target.type == 'text') {
                    break;
                }
            case 'Escape': 
                filterText.focus(); 
                filterText.select();
                ev.preventDefault();
                break;
            // case "ShiftLeft":
            // case "ShiftRight":
            case "Backquote":
            case "Tab":
                let btns = document.querySelectorAll('.btn'), a = false;
                for (let i = 0; i < btns.length; i++) {
                    if (btns[i].classList.contains('choose-btn')) {
                        btns[i].classList.remove('choose-btn');
                        btns[(i+1)%btns.length].classList.add('choose-btn');
                        i += 2;
                        for (; i < btns.length; i++) {
                            btns[i].classList.remove('choose-btn');
                        }
                        break;
                    }
                }
                ev.preventDefault();
                break;
            case "Enter":
                document.querySelector('.choose-btn').click()
                break;
        }
    }
    imgContainer.addEventListener("mousemove", e => {
        // console.log(`${e.buttons} ${e.movementX}`);
        /** 值（位掩码）：
            值	按键	常量
            0	没有按键	-
            1	左键	MouseEvent.BUTTON_LEFT
            2	右键	MouseEvent.BUTTON_RIGHT
            4	中键/滚轮	MouseEvent.BUTTON_MIDDLE
            8	浏览器后退	MouseEvent.BUTTON_BACK
            16	浏览器前进	MouseEvent.BUTTON_FORWARD
         */
        switch(e.buttons) {
            case 1: 
                if ('P' === e.target.tagName) {
                    break;
                }
                imgContainer.scrollLeft -= e.movementX;
                imgContainer.scrollTop -= e.movementY;
                break;
        }
        // msg.innerHTML = `clientY=${e.clientY}; layerY=${e.layerY}; offsetY=${e.offsetY}; pageY=${e.pageY}; screenY=${e.screenY}; y=${e.y}; movementY=${e.movementY}`;
        // msg.innerHTML = `clientX=${e.clientX}; layerX=${e.layerX}; offsetX=${e.offsetX}; pageX=${e.pageX}; screenX=${e.screenX}; x=${e.x}; movementX=${e.movementX}`;
    });
    document.addEventListener('wheel', (e) => {
        // if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        // 0 为鼠标滚轮, 或mac触控板缩放??
        // if (0 == e.deltaX) {
        //     document.body.scrollLeft += e.deltaY * 2;
        //     return;
        // }
        imgContainer.scrollLeft += e.deltaY;
    }, { passive: false });


    test(12, undefined, 13);
    function test(a, b = window.b, c = 'cc', d = 'dd') {
        console.log(`${a} ${b} ${c} ${d}`);
        return `${a} ${b} ${c} ${d}`;
    }
</script>
</html>
