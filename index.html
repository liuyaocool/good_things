<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta name="viewport" content="initial-scale=1">
    <title>GoodSearch</title>
<style>
    html, body { height: 100%; }
    body {
        background-color: #181a1b;
        margin: 0;
    }
    input, p {
        user-select: text;
        -webkit-user-select: text;
        -moz-user-select: text;
        -ms-user-select: text;
        cursor: text;
    }
    #jsonContainer {
        color: white;
    }
    #jsonContainer > div {
        margin: 5px;
        position: relative;
        background-color: #80808030;
        padding: 0 10px 10px 10px;
    }
    .fn {
        position: sticky;
        top: 0;
        color: #97ff00;
        font-size: 12px;
        text-align: right;
        height: 0px;
    }
    #jsonContainer h3 {
        color: #808080a3;
        font-size: 12px;
        margin: 10px 0 0 0;
    }
    #jsonContainer ul {
        padding-left: 15px;
        margin-top: 0px;
    }

    #imgContainer {
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        height: 100%;
        gap: 5px;
        align-content: flex-start;
        overflow: auto;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
    }
    #filterText {
        width: 230px;
        margin-bottom: 6px;
        color: white;
        outline: none;
        border: 1px solid #be9805;
        background-color: #0000;
        backdrop-filter: blur(3px);
    }
    #filterText:focus {
        border-color: #ffcb00;
    }
    hl {color: greenyellow;}
    sp {padding: 5px;}
    wh {color: white;}
    .item {
        width: 200px;
        display: inline-block;
        border-radius: 8px;
        overflow: hidden;
        background-color: #2a2c2e;
        border: 1px solid #727272;
    }
    .item img {
        width: 100%;
    }
    .item p {
        font-size: 14px;
        line-height: 1.4;
        margin: 0;
        padding: 2px 6px;
        color: gray;
    }
    .item > p::first-line {
        color: white;
    }
    .input {
        position: fixed;
        bottom: 3px;
        left: 200px;
        /* left: 50%; */
        /* transform: translateX(-50%); */
    }
    #msg {
        color: goldenrod;
    }
    .btn {
        cursor: pointer;
    }
    .choose-btn {
        background-color: #ffcc03;
    }
</style>
</head>
<body>
<div id="jsonContainer"></div>
<div id="imgContainer">
    <!-- <div class=item>
        <img draggable="false" src="pic/jp/J/JUR-163 白衣牛仔裤图书馆口.jpg">
        <p>adfadadfa<hl>dfad<br>adfadsfadf</hl>adsfads</p>
    </div> -->
</div>
<div class="input">
    <input id="filterText" type="text">
    <input type="button" class="btn choose-btn" onclick="search_pic()" value="search pic">
    <input type="button" class="btn" onclick="search_text()" value="search text">
    <span id="msg"></span>
</div>
</body>
<script>
    let files = [], files_json = {},
        files_json_name = [ '00_plot.json', '01_japan.json', '02_japan_infantry.json', '03_fc2ppv.json',
            '300MIUM.json',
            'AARM.json', 'ATOM.json', 'CLUB.json', 'DANDY.json', 'DOCP.json', 'FAA.json', 'FSET.json', 'FTKD.json', 'GBAN.json', 'GDHH.json', 'GETS.json',
            'HEZ.json', 'HGOT.json', 'HHF.json', 'HQIS.json', 'HTMS.json', 'HUNBL.json', 'HUNTA.json', 'HUNTB.json', 'HUNTC.json', 'HUNT.json',
            'IENE.json', 'IENF.json', 'JNC.json', 'KIL.json', 'LHBY.json', 'MFO.json', 'MIMU.json', 'NASH.json', 'NHDTA.json', 'NHDTB.json', 'NHDT.json', 'NXG.json',
            'OVG.json', 'RCT.json', 'RDD.json', 'RDT.json', 'SCOP.json', 'SCPX.json', 'SIM.json', 'SUJI.json', 'SW.json', 'VRTM.json', 'VSPDS.json', 'WA.json', 'ZMEN.json',
        ];
    fetch_file("piclist").then(text => {
        let lines = text.split('\n');
        for (let i = 4; i < lines.length; i++) {
            if (!lines[i]
                || lines[i].endsWith('.DS_Store')
                || lines[i].startsWith('pic/no/')
            ) continue;
            files.push(lines[i]);
        }
    });
    for (const fn of files_json_name) {
        fetch_file(`video/japan/${fn}`).then(text => files_json[fn] = JSON.parse(text))
        .catch(e => console.error(`---${fn}---`, e))
        ;
    }

    function search_text() {
        let s = filterText.value.trim().toLowerCase();
        if (!s) {
            msg.innerHTML = '输入关键词再搜索.';
            return;
        }
        switch_container(jsonContainer);

        hl_keys(s);
        let html_full = '', html_fn, html_block, html_k, html_line, exclude_k;
        for(const fn in files_json) {
            html_fn = '';
            for(const k in files_json[fn]) {
                html_block = '';
                exclude_k = k.length < 5 && k.endsWith('xx');
                html_k = exclude_k ? '' : hl_replace(k, '<hl>', '</hl>');
                for (const line of files_json[fn][k]) {
                    if (!html_k && !(html_line = hl_replace(line, '<hl>', '</hl>'))) continue;
                    console.log(line);
                    console.log(html_line);
                    html_block += `<li>${html_line ? html_line.join('') : line}</li>`;
                }
                if (html_block) {
                    html_fn += (exclude_k ? '' : `<h3>${(html_k ? html_k.join('') : k)}</h3>`) + `<ul>${html_block}</ul>`;
                }
            }
            if (html_fn) html_full += `<div><div class="fn">${fn}</div>${html_fn}</div>`;
        }
        jsonContainer.innerHTML = html_full;
    }
    function search_pic() {
        let s = filterText.value.trim().toLowerCase(), imgHtml = '', lineHtml;
        if (!s) {
            msg.innerHTML = '输入关键词再搜索.';
            return;
        }
        switch_container(imgContainer);

        hl_keys(s);
        for (const line of files) {
            if (!(lineHtml = hl_replace(line.slice(4, line.lastIndexOf('.')), '<hl>', '</hl>'))) continue;
            lineHtml[lineHtml.lastIndexOf('/')] += '<br>';
            imgHtml += `<div class="item">
                <img draggable="false" src="${line}">
                <p>${lineHtml.join('')}</p>
                </div>`;
        }
        imgContainer.innerHTML = imgHtml;
    }
    function switch_container(container_dom) {
        jsonContainer.style.display = 'none';
        imgContainer.style.display = 'none';
        container_dom.style.display = '';
    }

    function hl_keys(keys) {
        keys = keys.toLowerCase().split(' ');
        let k1, k2, tmp;
        for (let i = 0; i < keys.length; i++) {
            if (!keys[i]) continue;
            for (let j = i + 1; j < keys.length; j++) {
                if (!keys[j]) continue;
                [k1, k2] = [keys[i], keys[j]];
                if (k1[0] == '-' && k2[0] == '-') {
                    tmp = k1;
                    k1 = k2.slice(1);
                    k2 = tmp.slice(1);
                } else if (k1[0] == '-' || k2[0] == '-') {
                    continue;
                }
                if (k2.indexOf(k1) >= 0) {
                    keys[i] = '';
                    break;
                }
                if (k1.indexOf(k2) >= 0) {
                    keys[j] = '';
                }
            }
        }
        window.hl_key_arr = keys;
        return keys;
    }

    // return array, 如果需要字符串, 调用 .join('');
    function hl_replace(line_origin, hl_start, hl_end) {
        let line = line_origin.toLowerCase();
        let key_bit = new Array(line.length).fill(0), key_idx;
        for (const k of window.hl_key_arr) {
            if (!k) continue;
            if(k[0] == '-') {
                if (line.indexOf(k.slice(1)) >= 0) return null;
                continue;
            }
            if ((key_idx = line.indexOf(k)) < 0) return null;
            do {
                for (let i = 0; i < k.length; i++) {
                    key_bit[key_idx + i] = 1;
                }
            } while ((key_idx = line.indexOf(k, key_idx + 1)) >= 0)
        }
        let res = [], prev_bit = 0;
        for (let i = 0; i < line.length; i++) {
            res[i] = line_origin[i];
            if (key_bit[i] == prev_bit) continue;
            res[i] = (key_bit[i] == 0 ? hl_end : hl_start ) + line_origin[i];
            prev_bit = key_bit[i];
        }
        if (key_bit[key_bit.length-1] == 1) {
            res[res.length-1] += hl_end; 
        }
        return res;
    }

    async function fetch_file(file_path) {
        return (await (await fetch(file_path)).text());
    }

    document.onkeydown = function (ev) {
        console.log(`${ev.code}`);
        switch(ev.code) {
            case 'Slash': 
                // 排除浏览器默认搜索按键
                if ('INPUT' == ev.target.tagName && ev.target.type == 'text') {
                    break;
                }
            case 'Escape': 
                filterText.focus(); 
                filterText.select();
                ev.preventDefault();
                break;
            // case "ShiftLeft":
            // case "ShiftRight":
            case "ControlLeft":
            case "ControlRight":
                let btns = document.querySelectorAll('.btn'), a = false;
                for (let i = 0; i < btns.length; i++) {
                    if (btns[i].classList.contains('choose-btn')) {
                        btns[i].classList.remove('choose-btn');
                        btns[(i+1)%btns.length].classList.add('choose-btn');
                        i += 2;
                        for (; i < btns.length; i++) {
                            btns[i].classList.remove('choose-btn');
                        }
                        break;
                    }
                }
                ev.preventDefault();
                break;
            case "Enter":
                document.querySelector('.choose-btn').click()
                break;
        }
    }
    imgContainer.addEventListener("mousemove", e => {
        // console.log(`${e.buttons} ${e.movementX}`);
        /** 值（位掩码）：
            值	按键	常量
            0	没有按键	-
            1	左键	MouseEvent.BUTTON_LEFT
            2	右键	MouseEvent.BUTTON_RIGHT
            4	中键/滚轮	MouseEvent.BUTTON_MIDDLE
            8	浏览器后退	MouseEvent.BUTTON_BACK
            16	浏览器前进	MouseEvent.BUTTON_FORWARD
         */
        switch(e.buttons) {
            case 1: 
                if ('P' === e.target.tagName) {
                    break;
                }
                imgContainer.scrollLeft -= e.movementX;
                imgContainer.scrollTop -= e.movementY;
                break;
        }
        // msg.innerHTML = `clientY=${e.clientY}; layerY=${e.layerY}; offsetY=${e.offsetY}; pageY=${e.pageY}; screenY=${e.screenY}; y=${e.y}; movementY=${e.movementY}`;
        // msg.innerHTML = `clientX=${e.clientX}; layerX=${e.layerX}; offsetX=${e.offsetX}; pageX=${e.pageX}; screenX=${e.screenX}; x=${e.x}; movementX=${e.movementX}`;
    });
    document.addEventListener('wheel', (e) => {
        // if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        // 0 为鼠标滚轮, 或mac触控板缩放??
        // if (0 == e.deltaX) {
        //     document.body.scrollLeft += e.deltaY * 2;
        //     return;
        // }
        imgContainer.scrollLeft += e.deltaY;
    }, { passive: false });
</script>
</html>
