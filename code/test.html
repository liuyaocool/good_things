
<button onclick="openaa()">open</button>

<script>
let names = `
安城安娜
`.split('\n');

let idx = 0;

function openaa() {
    var nm;
    for (let i = 0; i < names.length; i++) {
        nm = names[i];
        if(nm.endsWith('??') || nm.endsWith('？？')) {
            goSearch(nm);
        }
    }
}

function goSearch(key) {
    window.open(`https://www.google.com/search?q=${key}%20av&tbm=isch`);
}

</script>
